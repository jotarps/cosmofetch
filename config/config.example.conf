# cosmofetch - arquivo de configuracao
# Local: ~/.config/cosmofetch/config.conf
# Linhas com # sao comentarios. Formato: chave = valor

# --- aparencia ---
# temas: cosmo, ocean, sunset, forest, mono, neon
theme = cosmo
# cores aceitam numero 0-255 ou nome (red, pink, orange, aqua...)
#key_color = 75
#user_color = 213
#host_color = 51
separator = ": "
#key_width = 12        # alinha os valores em coluna
bars = false           # barras de porcentagem (memoria, disco, bateria, cpu)
bar_width = 10
color = auto           # auto | true | false
truncate = true        # corta linhas maiores que o terminal

# --- logo ---
# logos: planet, galaxy, rocket, mountains, terminal, random
logo = planet
#logo_file = ~/meu-logo.txt   # qualquer arquivo de texto (aceita ANSI)
#logo_color = 213,177,141,105,69   # degrade (lista) ou cor unica
logo_position = left   # left | right | top | none
logo_padding = 2
logo_gap = 4
logo_center = true
#seed = 42             # semente dos logos procedurais

# --- imagem de verdade (kitty, WezTerm, Ghostty) ou chafa ---
#image = ~/foto.png
#image_protocol = auto  # auto | kitty | chafa
#image_width = 30

# --- modulos (veja --list-modules) ---
structure = title:separator:os:host:kernel:uptime:packages:shell:display:de:wm:theme:icons:font:cursor:terminal:cpu:gpu:memory:swap:disk:localip:battery:poweradapter:locale:break:colors

# --- modulos customizados: custom1..custom9 = Rotulo | comando ---
#custom1 = Kernel Cmd | uname -r
#custom2 = IP Publico | curl -s --max-time 3 https://api.ipify.org
# depois e so usar na structure: ...:cpu:custom1:memory:...

#weather_location = Curitiba
